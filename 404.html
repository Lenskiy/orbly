<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbly — 404</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{ --bg:#0B1018; --ink:#E9EDF2; --muted:#8B95A4; --accent:#E86A2E; --accent-hi:#F27E3E; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:22px; padding:32px; text-align:center;
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--ink); text-decoration:none}
  .logo{display:flex; align-items:center; gap:11px; font-weight:600; letter-spacing:.22em}
  .dot{width:10px; height:10px; border-radius:50%; border:2px solid var(--accent); box-shadow:0 0 12px -1px var(--accent)}
  h1{margin:0; font-weight:600; letter-spacing:-.025em; font-size:clamp(44px,6.4vw,72px); line-height:.96}
  p{margin:0; color:var(--muted); max-width:34em}
  .btn{display:inline-block; border:1px solid var(--accent); border-radius:12px; padding:14px 24px; font-weight:600; transition:border-color .15s}
  .btn:hover{border-color:var(--accent-hi)}
</style>
</head>
<body>

<a href="/" class="logo"><span class="dot"></span>ORBLY</a>
<h1>404</h1>
<p>Nothing scannable here. The page you were looking for does not exist.</p>
<a href="/" class="btn">Back to Orbly</a>

</body>
</html>
